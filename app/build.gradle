plugins {
    id 'com.android.application'
}

android {
    compileSdk 32

    defaultConfig {
        applicationId "com.android.wealth"
        minSdk 23
        targetSdk 30
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            //设置支持的SO库架构（开发者可以根据需要，选择一个或多个平台的so）
            abiFilters  "armeabi-v7a", "arm64-v8a"
        }
    }

    //签名
    signingConfigs {
        signing {
            //签名文件路径（密钥库密码配置在 local.properties 中）
            storeFile file(project.relativePath("key.jks"))
            storePassword project.hasProperty('KEYSTORE_PASSWORD') ? project.property('KEYSTORE_PASSWORD') : ''
            keyAlias project.hasProperty('KEY_ALIAS') ? project.property('KEY_ALIAS') : ''
            keyPassword project.hasProperty('KEY_PASSWORD') ? project.property('KEY_PASSWORD') : ''
            v2SigningEnabled true
            v1SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.signing
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.signing
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.annotation:annotation:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
    //glide 图片加载
    implementation 'com.github.bumptech.glide:glide:4.13.0'

    //adapter 框架
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.45'

    //数据转换库
    implementation 'com.google.code.gson:gson:2.8.9'

    // 下拉刷新
    implementation 'com.scwang.smartrefresh:SmartRefreshLayout:1.1.0-alpha-14'
    implementation 'com.scwang.smartrefresh:SmartRefreshHeader:1.1.0-alpha-14'

    // ViewPager 指示器
    implementation 'me.weyye.ColorTrackTabLayout:library:1.0.1'

    implementation 'com.contrarywind:Android-PickerView:4.1.9'

    //view背景库
    implementation 'com.github.JavaNoober.BackgroundLibrary:libraryx:1.7.4'

//    //  log日志
//    implementation 'com.orhanobut:logger:2.1.1'

    // 视频播放器
    implementation 'cn.jzvd:jiaozivideoplayer:7.7.0'

    // 权限申请
    implementation 'pub.devrel:easypermissions:3.0.0'

    // PictureSelector 基础 (必须)
    implementation 'io.github.lucksiege:pictureselector:v3.11.1'

    // 图片压缩 (按需引入)
    implementation 'io.github.lucksiege:compress:v3.11.1'
    // 图片裁剪 (按需引入)
    implementation 'io.github.lucksiege:ucrop:v3.11.1'

}